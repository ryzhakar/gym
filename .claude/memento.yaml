load_levels:
  self: loads with the charter, through its autoload lines
  start: read by pat-down at session start
  need: reached by a pointer when a task touches it
  latent: found by search only

kinds:

  charter:
    home: CLAUDE.md
    tier: charter
    load: self
    budget_tokens: 1500
    verification: owner-stated
    sections: [Condition, Session start, Goals, Prime directives, Pointers]
    goal_fields: [object, evidence, ground, constraints]
    format: >
      Autoload lines, then one `## ` section per name in sections, in that order,
      each heading starting with its name; Session start holds the hard opening
      sequence. Each goal is `### Goal <n> · <name> · <finite | standing> ·
      <status>`, then one `- <field>:` bullet per goal field, evidence only for a
      finite goal. Each prime directive is one bullet ending in `Ground:` and a
      dated owner statement or a commit.
    admission: >
      Owner-authored or owner-directed only. No facts, no history. Corrected in
      place on an owner ruling.

  frame:
    home: docs/ground-truth.md
    tier: charter
    load: self
    budget_tokens: 2500
    verification: owner-stated
    admission: >
      gym as given: whom it trains and from where, the areas and subjects in
      play, the owner's written values, and the tools gym uses. Refuses the goal,
      any measurement of what was built, and history. Owner rulings only.

  directive:
    home: docs/conventions.md
    tier: dossier
    load: self
    budget_tokens: 3000
    verification: grounded
    headings: [commit, records, code, owner]
    labels: [when, do, never, why, ground, except]
    required_labels: [when, do, ground]
    label_width: 8
    format: >
      One block per rule under the headings, in their order: a `### <id>`
      heading, lowercase words joined by hyphens and unique in the file, then one
      line per label in the order labels gives, each label padded to
      label_width; every block carries the required labels. except names a known
      misapplication. ground names a committed path, a commit SHA, a heading of a
      record, or a dated owner ruling. A heading joins headings in the change
      that writes its first rule.
    admission: >
      Project-local rules, and project-local clarifications or extensions of
      third-party instructions. Refuses what the system is (fact), incident
      stories (failure), measurements (fact), and knowledge whose home is
      elsewhere: upstream skills, manifestos, this schema.

  opinion_map:
    home: docs/opinion-map.md
    tier: dossier
    load: need
    verification: owner-stated
    admission: >
      The opinion map's architecture, true of every subject: purpose, readers,
      Language, evidence rules, bias controls, form, done and upkeep, and the
      map's interface to the rest of gym. Refuses anything true of one subject
      only, which goes to subject. Owner rulings, and design decisions marked
      "decided" under the owner's 2026-09-26 handover.

  subject:
    home: docs/subjects/*.md
    tier: dossier
    load: need
    verification: owner-stated
    admission: >
      One file per subject the opinion map is applied to, a language first: the
      depth and breadth the owner set for it, the subject's own instances of the
      Language, the findings about it that bind its map, and where its practice
      and influence evidence comes from. Refuses architecture, which goes to
      opinion_map. Owner rulings, and design decisions marked "decided".

  change:
    home: docs/architecture_log.md
    tier: journal
    load: self
    verification: held-before-verified
    fields: [KIND, FROM → TO, WHY, INVALIDATES, EVIDENCE, SUPERSEDED-BY]
    required_fields: [KIND, FROM → TO, WHY, INVALIDATES]
    kind_values: [computed, runnable]
    one_line_fields: [EVIDENCE]
    label_width: 15
    word_cap: 300
    format: >
      `## YYYY-MM-DD — Title`, or `## YYYY-MM-DD → YYYY-MM-DD — Title` for a
      change spanning days, then the fields in their order: the required fields
      always, the others when present. KIND takes one of kind_values; a one-line
      field takes one line. Labels padded to label_width, continuations indented
      to it. At most word_cap words per entry outside INVALIDATES, which is never
      compressed. Oldest first. INVALIDATES is read before quoting any number.
    admission: >
      A change to the core of what gym runs — the opinion map's Language and
      data layer, how Claims are drawn and checked, how the site is generated;
      the trainer program once it exists — that moved what is computed or what
      is runnable, from a shape gym actually held. Written only after the change
      is merged into main. Tooling, interface surface, documentation, process,
      review outcomes and filing never qualify.

  schema:
    home: .claude/memento.yaml
    tier: dossier
    load: self
    budget_tokens: 6000
    verification: owner-stated
    admission: >
      This file. Amended on the owner's word alone; each amendment is an events
      line naming what it replaced.

  map:
    home: .claude/memento-map.md
    tier: dossier
    load: start
    budget_tokens: 1000
    verification: reconciled
    format: >
      A dated audit line, then one table, columns path | kind | load | purpose.
      One row per non-latent record; one pattern row per latent home.
    admission: >
      Edited in the same change that adds, removes or renames a non-latent
      record. Latent files never touch it. A full audit runs on demand.

  fact:
    home: docs/capabilities.md
    tier: dossier
    load: need
    verification: measured
    format: >
      Present tense. A measurement carries its date. A pointer into the change log
      reads "decided YYYY-MM-DD, see docs/architecture_log.md" and only where that
      entry exists.
    admission: >
      What gym's built parts are and do. Refuses edit narration, decision
      history, process, and status snapshots.

  deferral:
    home: docs/user_deferred_items.md
    tier: dossier
    load: need
    verification: owner-stated
    admission: >
      Owner-authored only, in the owner's framing. A resolved entry is deleted
      and its resolution written as one events line.

  trace:
    home: docs/orchestration_log/history/{date}/events*.md
    tier: journal
    load: start
    verification: witnessed
    actors: [owner, self, "agent:<name>", "tool:<name>"]
    format: >
      One line per event: `YYYY-MM-DDTHH:MM | actor | kind | what`, the actor
      one of actors, the kind an event kind below, times never decreasing. The
      span's start date names the file and dates its first line; a parallel
      session writes events-<suffix>.md beside its session-<suffix>.md. Pat-down
      reads the newest file back to the last span-event.
    admission: >
      One event per line, written when it happens. Never a rule, never a settled
      conclusion.

  digest:
    home: docs/orchestration_log/history/{date}/session*.md
    tier: journal
    load: start
    verification: witnessed
    close_labels: [HEAD, state, open, next]
    close_label_width: 8
    state_max_lines: 3
    format: >
      The span's narrative, ending in a close block: `## Close —
      YYYY-MM-DDTHH:MM`, then one line per close label, padded to
      close_label_width: HEAD (sha, clean | dirty: paths), state (at most
      state_max_lines lines), open (waits, tripwires, delegations, or none), next
      (first step). Pat-down reads the newest close block.
    admission: The span's own narrative only; events go to trace.

  failure:
    home: docs/orchestration_log/history/{date}/failures.md
    tier: journal
    load: latent
    verification: witnessed
    entry_labels: [What happened, Mechanism, Correction]
    format: >
      `## <title>`, then one paragraph per entry label, in their order, each
      opening with the label and a colon; the day's trace carries a failure line
      for each entry.
    admission: One entry per failure diagnosed, written the day it is diagnosed.

  scratch:
    home: docs/orchestration_log/recon/{date}/
    tier: bench
    load: latent
    disposable: true
    verification: none
    admission: Claims under verification, drafts, worker returns at claim grade. Gitignored; binds nothing.

  archived:
    home: docs/orchestration_log/archive/
    tier: archive
    load: latent
    verification: none
    admission: Records out of force and kept. Moved in, never out.

events:
  decision: trace
  discovery: trace
  commitment: trace
  delegation: trace
  receipt: trace
  attenuation: trace
  span-event: trace
  failure: failure   # plus one trace line pointing at the entry
  change: change

token_estimate:
  tokens_per_word: 2.5
  measured: >
    2026-09-24, in the competera repo — /context-calibrated cl100k counts over
    its self-loading files and map, 2.49 overall, 2.2–2.9 per file (YAML
    highest). Not re-measured for gym. A budget_tokens value is a ceiling on
    words × tokens_per_word.

baseline: >
  No baseline record. The expected state is the newest session record's close
  block plus the events tail; pat-down measures the found state against them.

ratification: >
  Every record standing on 2026-09-26 is ratified (owner ruling 2026-09-26:
  "ratified otherwise", after dropping the polars and dev-orchestration
  manifestos from the orchestrator's stack). A record's fate, once set by the
  owner, is never re-verified with the owner.

filing:
  - Living records (charter, frame, directive, opinion_map, subject, fact, map, schema) hold only what is true now. Correct in place; never append a correction; never describe themselves — what a file is lives in the map.
  - Architecture goes to opinion_map; anything true of one subject goes to that subject's file; neither restates the other (owner ruling 2026-09-26).
  - A fact goes to fact, a behaviour it triggers to directive. One piece of knowledge may yield one entry in each; neither restates the other.
  - history/ holds dated journal records only. Transient orchestration artifacts go to recon/; a session record points at recon paths rather than copying them.
  - Authored prose carries no hard line wrapping. Tables, fenced blocks and field-aligned entries keep their breaks.

verification_depths:
  none: Stands by being written.
  witnessed: Written from the event itself, in the span it happened, never reconstructed later.
  owner-stated: Stands on the owner's word, with the owner's date and framing.
  measured: Checked against source or a measurement; carries that date. A count with no date fails.
  grounded: States the fact, goal, frame or ruling it rests on, in the entry.
  reconciled: Every row names a home that exists; every non-latent record has a row.
  held-before-verified: >
    Both halves read from saved artifacts or source — the prior shape actually
    held, and the change moved what is computed or runnable. Tooling,
    interface, documentation, process and review outcomes never pass.

kind_form:
  by: The home a record sits at. One home per kind, one kind per home; no record carries a kind field.
  home_grammar: >
    Paths from the project root, matched whole. A trailing `/` covers every path
    beneath; `{date}` is one ISO-date segment; `*` is any run of characters inside
    one segment.
  resolution: An exact path before a wildcard, both before a bare directory.
  outside_any_home: No kind, not admitted — except the products below.

provenance_form:
  written_as: Inline attribution in the record's own text; events lines carry it in their fields.
  author_class: '"owner ruling" (owner); "measured", "witnessed" or "decided" (self — "decided" marks a design decision taken under the owner''s 2026-09-26 handover of gym''s content and carries its ground); a tool name (substrate); "reported by <name>" (peer). No attributing word means unknown.'
  owner: Arthur Ryzhak.
  example: '"(owner ruling 2026-09-25, entered 2026-09-26)"; "(decided 2026-09-26, grounded on the owner handover of 2026-09-26)"; "— measured, 2026-09-26".'
  pointer_durability: Every path a mark names is committed, or a commit SHA. recon/ carries no provenance.

products:
  - path: README.md
    reason: Human front page, empty; the record system is not a human concern.

retired:
  - path: docs/orchestration_log/archive/TASK.md
    was: doc/TASK.md
    superseded_by: CLAUDE.md (goal, prime directive); docs/ground-truth.md; docs/opinion-map.md; docs/user_deferred_items.md
  - path: docs/orchestration_log/archive/SPEC.md
    was: doc/SPEC.md
    superseded_by: docs/opinion-map.md; docs/subjects/rust.md; docs/user_deferred_items.md
