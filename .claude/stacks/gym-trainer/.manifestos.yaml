# The gym-trainer stack as `you`, so unharness compiles it for a trainer session.
# Mirrors subagents.gym-trainer in the root .manifestos.yaml; change both together.
you:
  - name: cargo-cult-science
    purpose: claims and measurements
  - name: first-principles
    purpose: reasoning
  - name: simple-made-easy
    purpose: organisation
  - name: raise-the-bar
    purpose: demands and feedback
  - name: write-well
    source: skill agent-conduct:write-well
    purpose: prose, in its form
  - name: stop-yapping
    purpose: communication, in its content
