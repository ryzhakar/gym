text: Responding directly to an objection that the idea is too niche, argues "JavaScript interop is not a complex or niche topic and this is a major quality of life improvement to that story," and that Rust has tackled harder, more niche problems before, while conceding the proposal must be justified for Rust on its own merits rather than by Clang precedent.
