text: After iterating through three worse designs (manual return-value wiring, one-function-per-field event handlers, an all-optional model needing manual `Some`-checking), settled on a derive proc macro generating a diff enum, so "if a state field is added or removed on the Rust side, this Swift function will fail compilers' enum exhaustiveness checks until it is added."
