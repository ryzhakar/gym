text: Prefers the feature live in `js-sys` rather than `getrandom` directly, since "such incorrect behavior does not get punished, while users would be more careful with js-sys" — a crate wrongly adding `js-sys` unconditionally is a more visible mistake than wrongly enabling a `getrandom` feature, which has no effect on non-WASM targets and so goes unpunished.
