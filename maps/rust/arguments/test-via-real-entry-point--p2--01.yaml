id: test-via-real-entry-point--p2--01
position: test-via-real-entry-point--p2
side: for
text: The dangerous bugs aren't in new code, they're in what old code used to do that nothing does anymore — a refactor can silently stop enforcing a check with no test failing and no diff showing a deleted check; requires inventorying every rejection the old code could produce, testing every parse-time rejection through the actual production entry point rather than only the check's own unit tests, and auditing fallible conversions (`.ok()`, `unwrap_or`, defaulted `try_from`) that could silently turn an invalid value into one a check treats as benign, citing two real incidents that slipped through this exact gap with green CI
values:
- correctness
