text: '"We will go with option 2. A drop-in middleware that just works is worth a lot in practice" — weighed both designs explicitly: a descriptive `Err` keeps callers in control of the response shape but requires every consumer to write a translation layer, while a pre-baked `Ok(response)` "just works" the moment it''s added, at the cost of a baked-in response shape (mitigated later with override hooks).'
