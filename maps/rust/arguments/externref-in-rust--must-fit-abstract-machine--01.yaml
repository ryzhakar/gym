text: '"This RFC is proposing to introduce a fundamentally new kind of thing to Rust only to then make that thing a complete nightmare to use for anything" — the RFC''s semantics can''t be expressed in the Abstract Machine that MIR-transform and MIR-to-LLVM-IR correctness proofs rely on, an unprecedented kind of break worse than prior type-system-assumption-breaking RFCs, and without integration into `Result`, async, `==`, or newtypes the feature will feel bolted on.'
