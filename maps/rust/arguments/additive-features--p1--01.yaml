id: additive-features--p1--01
position: additive-features--p1
side: for
text: The `std` feature should not be necessary to just build the crate, even on Linux/Windows targets — requiring it defeats the purpose of feature gating, and "these CI changes shouldn't be necessary." There's also no CI coverage that a no_std build even works on Linux/Windows, so the requirement would easily regress unnoticed.
