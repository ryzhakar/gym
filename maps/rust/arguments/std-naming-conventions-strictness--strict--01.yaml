text: '`into_` should only be used where the method actually consumes `self` — a name that doesn''t match its ownership signature should be renamed; `to_owned` is not a bad name: the receiver is neither doing the owning nor being owned, it''s being copied into a different form, so `own()` would misdescribe the operation, and the Rust API Guidelines document is the standing rationale for the `to_` prefix here'
