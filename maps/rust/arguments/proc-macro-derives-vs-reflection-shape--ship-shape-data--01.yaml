text: 'Instead of turning types into more code, ship data about types: a single associated `SHAPE` constant per type (name, offset, alignment, type id, variants, attributes, doc comments) that many downstream behaviors can consume from one derive, avoiding the ecosystem-adoption cost of a new trait/derive per behavior.'
