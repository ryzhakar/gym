text: For this particular pivot-replacement site, machine epsilon (`finfo().epsilon`) is the wrong semantic quantity regardless of dtype — it's still much larger than the small-scale pivot values that would get silently corrupted, so the exact-zero check should stay hardcoded rather than switch to a dtype-derived value.
