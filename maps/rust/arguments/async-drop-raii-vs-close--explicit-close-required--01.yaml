id: async-drop-raii-vs-close--explicit-close-required--01
position: async-drop-raii-vs-close--explicit-close-required
side: for
text: Without reliable async `Drop`, an endpoint no longer attempts best-effort graceful close on drop; callers must `await` `close()` explicitly, and that explicit path is made cheap (near-instant when the peer already closed, ~1 RTT otherwise) so it functions as the primary, first-class shutdown mechanism rather than a fallback.
values:
- stability
