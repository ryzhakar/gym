id: silent-fallback-vs-explicit-error--fail-loudly--01
position: silent-fallback-vs-explicit-error--fail-loudly
side: for
text: An `allow_missing = true` option that lets the build succeed and then 404 at request time turns a build-time problem into a silent runtime one — a bad default; `unwrap_or_default()` mostly hides the problem rather than fixing it, since a server function that actually sets `ResponseOptions` would silently fail to have its header/status applied; asks whether the code should return an error when multiple TCP sockets are listed, rather than silently using the first, since picking the first could cause odd behavior if it's the wrong one
values:
- correctness
