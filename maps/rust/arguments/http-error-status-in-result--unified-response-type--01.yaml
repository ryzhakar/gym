text: '"There aren''t really ''successful'' or ''unsuccessful'' responses, just responses" — describes a design where all HTTP responses live in one enum returned directly by the handler, which keeps status-code categorization simple but means `?` doesn''t work directly and needs a separate inner function plus manual matching to bridge back into the enum.'
