id: typed-wrapper-vs-raw-access--p2--01
position: typed-wrapper-vs-raw-access--p2
side: for
text: Repeatedly questions raw volatile register operations in favor of PAC-generated typed accessors, treating a missing PAC accessor as a bug to be fixed in the PAC itself rather than worked around with manual bit ops; likewise, typing a column family's name out every time is error-prone (a typo causes a panic since the column family doesn't exist), so the name and type of each column family should be defined once and every read/write routed through a typed method
values:
- correctness
