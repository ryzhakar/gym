text: '"A non-zero cost wrapper could work better": `externref` could act as a table index everywhere in Rust-only code, with the real WebAssembly `externref` crossing only at FFI boundaries, and an optimization pass eliding the table insert/extract round-trip whenever a value is merely passed straight through — rather than adding a new first-class restricted language type.'
