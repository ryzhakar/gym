text: Many guides write the JNI and FFI layers in Rust, but choosing C++ for the JNI side instead lets Android Studio's native-C++ project tooling — code generation, build automation, code analysis, and jump-to-declaration between Kotlin and C down to the FFI headers — work across the boundary; Android Studio has no comparable integration with Cargo.
