id: in-app-vs-infrastructure-concern--rate-limit-in-app--01
position: in-app-vs-infrastructure-concern--rate-limit-in-app
side: for
text: Usage plans don't exist at all on HTTP API v2, are invisible to clients even on REST ("there are no X-RateLimit-* response headers"), require API keys pre-provisioned up to a hard cap of 10,000 per account/region, and only offer DAY/WEEK/MONTH windows rather than the 15-minute window the use case needs.
