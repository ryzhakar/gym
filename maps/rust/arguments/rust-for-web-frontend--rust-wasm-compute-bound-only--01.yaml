id: rust-for-web-frontend--rust-wasm-compute-bound-only--01
position: rust-for-web-frontend--rust-wasm-compute-bound-only
side: for
text: Rewriting a Rust/WASM parser into pure TypeScript showed the Rust computation was never the bottleneck — the entire cost was the WASM/JS boundary (serialize in, serialize out); WASM wins only for compute-bound work with rare boundary crossings (image/video, crypto, physics) and loses on parsing into JS objects or frequently-called functions on small inputs, because V8's JIT closes the raw-compute gap
