id: mutex-vs-atomics--mutex-unless-contended--01
position: mutex-vs-atomics--mutex-unless-contended
side: for
text: If there are many threads and heavy lock contention, move to lock-free data structures (crossbeam, parking_lot); if a lock is rarely contended, a normal mutex-based structure is simpler and just as good, because lock-free implementations bring their own hazards (e.g. the ABA problem).
values:
- simplicity
- performance
