id: library-io-factored-out--p2--01
position: library-io-factored-out--p2
side: for
text: Since spawning threads panics on `wasm32-unknown-unknown`, a portable library should factor thread spawning out to the caller — "bring their own threads" — the same way it factors out I/O, which also plays nicer with apps that own a custom thread pool.
