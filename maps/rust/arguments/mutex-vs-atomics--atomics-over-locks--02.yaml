id: mutex-vs-atomics--atomics-over-locks--02
position: mutex-vs-atomics--atomics-over-locks
side: for
text: Atomics and compare-and-swap are fine — worst case is livelock, which is rare and usually recovers — while a lock is "always a disaster waiting to happen" because something will eventually die holding it; goes as far as calling the mere existence of a lock, even inside a library, always a programming bug.
