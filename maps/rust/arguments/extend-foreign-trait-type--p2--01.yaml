text: 'The crate effectively already has "its own `Operation`... if you squint a little" (currently just a type-alias out of laziness); users should not need to know or care whether they''re going through `embedded_hal`''s `Operation` or the crate''s own, so making it a real, independently extensible type is fine even as a breaking change: "it is something the user should neither know, nor care about."'
