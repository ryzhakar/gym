id: blocking-work-in-async--p1--01
position: blocking-work-in-async--p1
side: for
text: 'Match the mechanism to the shape of the work: use `spawn_blocking` for blocking IO ("you cannot use a second runtime or other thread pool, at least if you need optimal performance"); use `std::thread::spawn` rather than a thread-pool slot for a thread that will run forever ("since it will use up one of the pool''s threads"); use a dedicated thread pool (e.g. Rayon) or a second async runtime for sustained CPU-bound work; a dedicated thread or `spawn_blocking` is an easy, if suboptimal, choice when performance needs are modest.'
values:
- performance
