id: async-vs-threads--p2--01
position: async-vs-threads--p2
side: for
text: 'OS threads need no new programming model and let existing synchronous code run unchanged, and support OS-level thread-priority tuning, but carry real per-thread CPU/memory overhead; async supports orders of magnitude more concurrent tasks for the same overhead, especially IO-bound work like servers and databases, and — being zero-cost with no required heap allocation or dynamic dispatch — can run in constrained environments like embedded systems, at the cost of larger compiled binaries and a bundled runtime. Explicitly frames this as "not better than threads, but different": use threads if you don''t need async''s performance benefits.'
values:
- performance
- simplicity
