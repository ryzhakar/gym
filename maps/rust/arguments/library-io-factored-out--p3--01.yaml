id: library-io-factored-out--p3--01
position: library-io-factored-out--p3
side: for
text: Since the Web has no filesystem and I/O there is always asynchronous, a portable library should factor I/O out of itself entirely, taking input slices from callers rather than reading files or performing I/O directly.
