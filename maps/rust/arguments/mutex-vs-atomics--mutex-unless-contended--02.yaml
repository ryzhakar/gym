id: mutex-vs-atomics--mutex-unless-contended--02
position: mutex-vs-atomics--mutex-unless-contended
side: against
text: The existence of a lock is "always a programming bug even inside a library" — the worst case with atomics/CAS is a rare, recoverable livelock, versus a lock's potential to be held by something that dies, grinding the whole system to a halt.
