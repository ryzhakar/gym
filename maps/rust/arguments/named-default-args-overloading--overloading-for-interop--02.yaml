position: named-default-args-overloading--overloading-for-interop
side: against
text: Rust has for years opposed named parameters, optional/default arguments and overloading altogether, because the features are numerous and mutually entangled, and the current one-function-one-signature rule keeps the language simple at an acceptable cost.
