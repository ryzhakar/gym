id: feature-flags-vs-separate-crates--split-into-crates--01
position: feature-flags-vs-separate-crates--split-into-crates
side: for
text: Splits Postgres access into per-domain sub-crates (`accounts`, `payments`) behind an `interfaces` crate, since "the sub-crates only care about primitive types... types used by the repository interface can change... without impacting the sub-crate API," keeping sub-crate public APIs stable while letting the Postgres stack be shared with another engineer decoupled from the host Axum app.
values:
- stability
- simplicity
