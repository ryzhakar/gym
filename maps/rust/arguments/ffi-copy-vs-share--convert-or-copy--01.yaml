text: '"Copying immutable data is generally safer and easier than trying to share it" — creating an FFI struct that copies out of the Rust result object, rather than sharing a pointer into it, costs a small performance penalty but guarantees memory management on one side of a binding can''t affect the other side, which is judged worth it "more often than not."'
