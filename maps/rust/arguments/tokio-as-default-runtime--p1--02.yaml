id: tokio-as-default-runtime--p1--02
position: tokio-as-default-runtime--p1
side: against
text: There is no asynchronous runtime in the standard library, and none are officially recommended — Tokio, async-std, smol and fuchsia-async are listed as options without ranking, and cross-runtime incompatibility (Tokio's mio-based reactor vs. the async-executor/futures-I/O-trait world of async-std and smol) is a reason to research fit before committing to one
values:
- stability
sources:
- f000233
