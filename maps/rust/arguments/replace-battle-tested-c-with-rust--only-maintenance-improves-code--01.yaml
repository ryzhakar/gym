id: replace-battle-tested-c-with-rust--only-maintenance-improves-code--01
position: replace-battle-tested-c-with-rust--only-maintenance-improves-code
side: for
text: Rejects the "old codebases are more optimized/battle-tested" meme as false in general — it depends on whether someone actually spent time optimizing or fuzzing; a Rust crate (encoding_rs) beat glibc's iconv because of iconv's fundamentally slow architecture, and unfuzzed "battle-tested" old code can still hide bugs the first real fuzzer finds.
values:
- performance
- correctness
