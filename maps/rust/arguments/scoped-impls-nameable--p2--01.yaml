text: 'Names are wanted: an explicit mechanism to specify a type along with explicitly chosen impls would make the implicit scoped-impl behavior desugar from something writable, making it easier to follow what''s happening even if users rarely write the explicit form by hand; names would also let two implementations of the same trait/type coexist in one module and let compiler errors point at a normal path instead of "the impl from this module"'
