text: There's no way to force-invalidate a session or change permissions on the fly when the data lives on the client, so whatever effort is saved by skipping a server-side store is negated by that inflexibility; encrypted cookies also aren't good practice in production since they can enable replay attacks — storing sensitive data server-side is always the better choice
