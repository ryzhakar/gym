id: in-app-vs-infrastructure-concern--p1--01
position: in-app-vs-infrastructure-concern--p1
side: for
text: '"Nginx is often put in front of http services written in any language... People do it for performance reasons and to access solutions to problems that can be decoupled from the actual response logic" — nginx''s actual value in front of an HTTP service is providing decoupled operational concerns (flood protection, bandwidth throttling, load balancing, TLS termination) that a new in-process server doesn''t reproduce, so dropping nginx removes that role rather than replacing it.'
values:
- simplicity
- performance
