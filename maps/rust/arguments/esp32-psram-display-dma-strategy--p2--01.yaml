text: Two PSRAM framebuffers feeding two 1/16 SRAM bounce buffers via looping DMA, with descriptors locating the emitted slice through a `DMA_OUT_CHx` interrupt and canceling late refills, achieved "double-buffered glitch-free output without relying on XiP from PSRAM" at 31.1 FPS; a CPU-copy alternative was rejected as "glacial."
