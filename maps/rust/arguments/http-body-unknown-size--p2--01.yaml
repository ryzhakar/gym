text: '"Changing `()` to have an unknown body size feels too broad to me. I worry that might impact other responses using `()` that don''t care about HEAD requests" — resists making `()` default to an unknown body size because it could silently change behavior for unrelated responses, wanting a fix that works for users unfamiliar with axum''s APIs rather than one requiring explicit opt-in.'
