id: immediate-vs-retained-gui--doesnt-matter-at-small-scale--01
position: immediate-vs-retained-gui--doesnt-matter-at-small-scale
side: for
text: '"I''m not sure I love immediate mode on principle, although at this scale it extremely doesn''t matter" — immediate mode avoids widget-lifetime bookkeeping and is easier to integrate into a game engine''s GPU loop; retained mode can perform better by not rebuilding the whole UI every frame, but at small scale the difference is untestable.'
values:
- simplicity
- performance
