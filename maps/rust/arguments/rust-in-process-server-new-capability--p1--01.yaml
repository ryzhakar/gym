text: Making well-written C safe to *use* generally requires isolating it in a separate process the way nginx does; Rust instead lets an expert's high-performance, "cursed" code be reused safely as a library by less-expert programmers in the same language — that reuse, not an abstract "Rust safe, C dangerous" claim, is what's novel
