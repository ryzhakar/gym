text: librsvg is dropping gdk-pixbuf's C image decoders for the Rust `image-rs` crate, explicitly acknowledging the incumbent C libraries are heavily tested and continuously fuzzed and that the Rust decoder crates are comparatively less developed on performance and exotic-format support, but framing the move as an opportunity to find and fix exactly the gaps that remain rather than a claim of already-equal maturity.
