text: 'A real safety cost is worth paying: citing a session where an unsafe/unmanaged-heavy game (Ark: Survival Ascended) crashed three times and topped out near 45 FPS, a 10% perf hit (40 FPS) for a memory-safe implementation that doesn''t crash is preferable, and would likely be an acceptable tradeoff generally for people who "just want to play games instead of deal with constant unnecessary interruptions"'
