id: ecs-relationship-type-level-exclusivity--p1--01
position: ecs-relationship-type-level-exclusivity--p1
side: for
text: The edge type should have a different interface based on its exclusivity — one-to-many derefs to `Entity`, many-to-one to `[Entity]` — because it makes incorrect usage fail to compile, improves error messages, and keeps the model close to what `Parent`/`Children` already are for users, for reflection, and for scene-serialization formats (BSN/`ron`).
values:
- correctness
