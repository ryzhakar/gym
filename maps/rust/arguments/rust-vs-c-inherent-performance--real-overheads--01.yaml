id: rust-vs-c-inherent-performance--real-overheads--01
position: rust-vs-c-inherent-performance--real-overheads
side: for
text: 'Safe Rust has real, measurable costs: it requires a value at construction time rather than dataflow-based init-before-use, so a large array or small-object allocator ends up eagerly zero-initializing memory it may never read, sometimes bloating codegen enough to block inlining; trivial features can force large refactors via new borrowing schemes, and clones or `Rc` get added defensively to satisfy the borrow checker where they aren''t algorithmically necessary; disassembly on nontrivial examples shows bounds checks, unsafe-gated SIMD intrinsics, poorly-optimizing iterators, `RefCell` overhead, and un-collapsible `Result` wrapping'
values:
- performance
