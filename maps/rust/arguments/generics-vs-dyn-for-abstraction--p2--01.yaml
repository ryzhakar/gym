text: Generic functions get monomorphized into one copy per concrete type, growing `.wasm` code size; using trait objects instead of type parameters emits a single dynamically-dispatched copy — "the downside is the loss of the compiler optimization opportunities and the added cost of indirect, dynamically dispatched function calls."
