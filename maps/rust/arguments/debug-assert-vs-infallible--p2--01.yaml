id: debug-assert-vs-infallible--p2--01
position: debug-assert-vs-infallible--p2
side: for
text: '"I don''t like debug_asserts at all, especially in a library. When you''re wrong and they fail, you''re slapping your user''s users with a pain point which is hard to report, and which takes a release of both projects in order to fix" — so the code should instead be made infallible.'
values:
- stability
