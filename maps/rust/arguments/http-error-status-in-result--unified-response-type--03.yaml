text: '"Return Ok(response) for anything you want the client to see, even when the response is a 401, 403, 429, or 500" — an `Err` that escapes all the way to `lambda_http::run` is treated as an invocation error, so API Gateway answers the client with a generic 502 instead of the carefully designed status code; avoiding that confusion is the entire reason for the rule.'
