id: rust-vs-c-inherent-performance--init-cost-narrow--01
position: rust-vs-c-inherent-performance--init-cost-narrow
side: for
text: Rust has no default initialization; it merely requires init *before use* based on dataflow analysis, the same as for an ordinary variable — so any zero-init cost should only bite in narrow cases like large arrays or read buffers, not as a blanket tax, and it's fair to ask whether the allocator scenario generalizes at all
values:
- correctness
- performance
