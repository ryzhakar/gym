id: library-auth-opinionated-vs-unopinionated--authenticated-managed-default--01
position: library-auth-opinionated-vs-unopinionated--authenticated-managed-default
side: for
text: An open relay's URL is a credential that ships in every client and leaks (visible to anyone watching a connection get established), so anyone who learns it can spend its finite bandwidth — which is why managed relays deployed from a given date onward require a signed, expiring, endpoint-bound token issued from the project's API key.
