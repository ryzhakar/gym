id: async-vs-threads--async-tasks-on-embedded--01
position: async-vs-threads--async-tasks-on-embedded
side: for
text: 'Async/await''s "improved ergonomics" over manual sub-task splitting are compatible with strict resource requirements on embedded: the compiler forbids awaiting while holding a resource (preserving SRP''s priority-ceiling guarantees), and compile-time-generated static executors avoid dynamic allocation altogether, so there''s no risk of an out-of-memory panic the way a heap-allocating task model would have.'
