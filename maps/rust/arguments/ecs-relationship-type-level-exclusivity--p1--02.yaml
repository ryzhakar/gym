id: ecs-relationship-type-level-exclusivity--p1--02
position: ecs-relationship-type-level-exclusivity--p1
side: against
text: Type-level exclusivity is not even correct in practice, since an entity can still hold both a `OneToOne<R>` and a `OneToMany<R>` edge of the same relationship, and it forces every query site to know and restate the edge shape; "being at a type level is not a benefit it is the option," and consistency of one query API matters more than having that option.
values:
- correctness
- simplicity
sources:
- f002142
