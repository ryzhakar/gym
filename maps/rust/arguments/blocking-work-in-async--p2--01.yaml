text: 'A warning against ever using Tokio''s single-threaded runtime except when no OS threads are available is wrong: "If you want to N:1 scheduling of async tasks (instead of M:N), using the single threaded runtime is the right choice," though combining it with blocking syscalls on that same thread is an unusual choice.'
