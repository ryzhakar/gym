id: named-default-args-overloading--overloading-for-interop--01
position: named-default-args-overloading--overloading-for-interop
side: for
text: 'Rust should support built-in overloading today, especially for interop with existing languages: C++ API maintainers rely on adding overloads without breaking existing callers, Rust already fakes overloading inconsistently via trait dispatch (multiple `From` impls, `Into`''s return-type-directed dispatch), and built-in overloading could also resolve an aliasing problem by letting the compiler pick a safe vs. unsafe overload based on the caller''s reference.'
values:
- approachability
- correctness
