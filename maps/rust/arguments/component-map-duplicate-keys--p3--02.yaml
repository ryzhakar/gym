id: component-map-duplicate-keys--p3--02
position: component-map-duplicate-keys--p3
side: against
text: An "authorization middleware" component inspecting a map parameter needs the middleware and the next component to treat duplicate keys identically — e.g. a map like `{"action":"view","action":"delete"}` must resolve the same way everywhere — which argues for stronger, spec-guaranteed language rather than optional, host-discretionary dedup.
values:
- correctness
