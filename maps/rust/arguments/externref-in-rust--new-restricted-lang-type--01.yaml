text: Proposes `core::arch::wasm32::externref`, "an opaque, unforgeable reference to a WebAssembly host value," legal only as a bare top-level type of function parameters/returns/locals, lowering to Wasm's `externref` reference type, so host references (e.g. JS values) can marshal directly across foreign calls for interoperability and performance.
