text: '"Equality (and hashing) *should* hold when a `Func` refers to the same function within a store, regardless how it''s reached... we need to provide separate methods on the `Func` for this" — pointer-identity equality on the bare handle is surprising because it doesn''t hold across import/export boundaries even for the same underlying function, so correct identity needs a store borrow and must be separate methods rather than literal `Eq`/`Hash` impls.'
