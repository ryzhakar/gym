text: '"Rust doesn''t stand out" on the one thing that would really matter (aliasing): the borrow checker tells the compiler a reference is the only one that may *modify* through it, but not that nobody else has *access* at all, which is what would actually enable more optimizations — so in practice the discussion is just about which language makes it easier to write fast programs, an ecosystem/library question rather than a language one'
