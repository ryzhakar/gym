text: Tokio and Hyper are both very fast on their own, but Axum adds its own routing/extractor overhead on top — surprising, since Actix-Web previously topped benchmarks while also providing routing and extractors, so Axum wasn't expected to differ much; where complex path routing and extractors aren't needed, it's probably better to use Hyper and Tower directly
