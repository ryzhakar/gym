id: rust-vs-c-inherent-performance--p1--01
position: rust-vs-c-inherent-performance--p1
side: for
text: 'The practical gap is partly ecosystem-driven: C''s lack of an easily-reached-for hashmap pushes real code toward slow linear searches until it becomes a forced problem (citing a GitLab backup-time postmortem), while Rust''s easy hashmaps and parallel iterators make fast-by-default collections and code the norm in practice — so the live discussion is just which language makes it easier to write fast programs'
