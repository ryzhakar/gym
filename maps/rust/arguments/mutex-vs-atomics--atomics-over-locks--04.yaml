id: mutex-vs-atomics--atomics-over-locks--04
position: mutex-vs-atomics--atomics-over-locks
side: against
text: If there are many threads and heavy lock contention, move to lock-free structures; but if a lock is rarely contended, a normal mutex is simpler and just as good, since lock-free brings its own hazards like the ABA problem.
