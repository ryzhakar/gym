id: library-error-type-opaque-vs-typed--wrap-in-anyhow-for-context--01
position: library-error-type-opaque-vs-typed--wrap-in-anyhow-for-context
side: for
text: '`thiserror` currently only supports the default `{}` Display format, which loses the full source-error chain (e.g. an AWS SDK `Unhandled` variant losing the underlying resource info); the workaround is to wrap typed errors in `anyhow` or `eyre`, which support the alternate `{:#}` display that preserves context.'
