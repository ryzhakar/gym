id: rust-vs-c-inherent-performance--composability-wins--01
position: rust-vs-c-inherent-performance--composability-wins
side: for
text: Rust's composability lets an engineer reach for a B-Tree where in C they'd stick to the safer-to-ship AVL tree, because a hand-rolled intrusive C B-Tree is too risky to trust ("up in everything's underwear"); what wins in practice is what engineers are actually willing to ship, not who tops a benchmark, and a hand-rolled generic concurrent hash table was in practice replaced by an off-the-shelf container plus a lock, coming out both more maintainable and faster
values:
- simplicity
- performance
