side: for
text: 'Blocked from pushing small Rust-motivated robustness and lifetime fixes into a C-side scheduler, with every kernel panic in one''s own Rust driver tracing back to bugs in that unfixed C code: "some Linux kernel maintainers just don''t care about future code quality, or about stability or security any more. They just want to keep their C code and wish us Rust folks would go away." A maintainer resigns after nearly four years, citing exhaustion with "nontechnical nonsense" rather than technical disagreement, and states the future of kernels "is with memory-safe languages."'
