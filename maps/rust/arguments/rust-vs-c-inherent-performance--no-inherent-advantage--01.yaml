text: 'Looking at actual disassembly on nontrivial examples shows recurring, real costs: mandatory heap-then-stack-allocation patterns, zero-init by default, bounds checks on array/division/shift access, unsafe-gated SIMD intrinsics, iterators that optimize poorly, `RefCell` overhead, and un-collapsible `Result` wrapping — which is why Rust solutions don''t top competitive-programming leaderboards'
