text: zebra-chain's data structures are deliberately defined so invalid states are unrepresentable — the `Transaction` enum has one variant per transaction version, so it is impossible to construct a transaction with spend/output descriptions but no binding signature, or a version-2 (Sprout) transaction carrying Sapling proofs.
