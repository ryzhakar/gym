text: '"Zebra has a modular, library-first design, with the intent that each component can be independently reused outside of the zebrad full node" — in contrast to zcashd''s monolithic architecture, Zebra is factored into independently reusable library crates (zebra-chain, zebra-network, zebra-state), and the contributing guide names this as a scope boundary against a monolithic, feature-flagged binary.'
