id: lambda-vs-containers--serverless-first--01
position: lambda-vs-containers--serverless-first
side: for
text: After porting the same Rust web API and a Kafka-consuming background service from Fargate to Lambda, latency (p50/p99) held steady, memory usage dropped, cold starts were a rare minority of invocations, and the 24/7 idle container cost disappeared — concludes serverless should be reached for by default.
