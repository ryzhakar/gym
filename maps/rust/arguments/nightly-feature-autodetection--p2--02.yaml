id: nightly-feature-autodetection--p2--02
position: nightly-feature-autodetection--p2
side: against
text: Nightly features should be opt-in, not opt-out; libraries auto-enabling features run counter to the Rust Project's own principle that unstable features only impact those who opted in, and harm nightly users who didn't consent to other unstable behavior silently changing.
