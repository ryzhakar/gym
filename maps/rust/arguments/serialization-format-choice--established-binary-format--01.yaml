text: Postcard is preferred over a bespoke or JSON serialization as a simpler, well-defined format similar to what's already being generated; separately, since postcard is non-self-describing, enum case order must be preserved as a stability contract for the protocol to remain stable long-term — a requirement to design around, not a reason to avoid it
