id: named-default-args-overloading--reject-all-for-simplicity--01
position: named-default-args-overloading--reject-all-for-simplicity
side: for
text: Has for years opposed Rust adding named parameters, optional/default arguments and function overloading — all requested since at least a twelve-year-old GitHub issue — arguing the features are numerous and mutually entangled, and that Rust's current rule (one function, one signature; write a differently-named function or a builder for variants) keeps the language simple at an acceptable cost.
values:
- simplicity
