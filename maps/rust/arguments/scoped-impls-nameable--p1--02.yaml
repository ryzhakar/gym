id: scoped-impls-nameable--p1--02
position: scoped-impls-nameable--p1
side: against
text: 'Names are wanted: with them, two implementations of the same trait/type could coexist in one module (e.g. case-sensitive and case-insensitive `Eq`), and an explicit mechanism to specify a type with explicitly chosen impls would let the implicit scoped-impl behavior desugar from something writable, and let compiler error messages point at a normal path instead of "the impl from this module"'
