id: aya-vs-libbpf-rs
text: For writing eBPF programs from Rust, should you use a pure-Rust implementation with no libbpf/BCC dependency (Aya), or a Rust wrapper around the native C `libbpf` library with the eBPF program itself written in C (libbpf-rs)?
