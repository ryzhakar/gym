id: shared-hw-resource-refcount-vs-raii
text: For a shared hardware resource with an enable/disable lifecycle (a radio PHY clock shared across peripherals), should safety rest on a reference-counted controller object, or on RAII-style exclusive ownership tied to the peripheral singletons themselves?
