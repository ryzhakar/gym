id: work-stealing-vs-thread-per-core
text: For async Rust HTTP servers, is a work-stealing runtime (Tokio's default) or an executor-per-thread/"thread-per-core" runtime (Glommio, or Tokio/Smol configured with a `LocalRuntime`/`LocalExecutor` per thread) the better architecture — and is either one simply faster, or is the right choice workload-dependent?
