id: boxed-vs-hand-written-future
text: when a tower `Service::call` needs to inspect or transform the response after the inner future resolves, should its associated `Future` be a boxed dynamic future (`Pin<Box<dyn Future<...> + Send>>`, built with `Box::pin(async move {...})`), or a hand-written `poll`-driven future struct (via `pin-project`) that avoids the heap allocation?
