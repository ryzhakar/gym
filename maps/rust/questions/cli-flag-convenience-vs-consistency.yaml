id: cli-flag-convenience-vs-consistency
text: For a CLI flag guarding a destructive action where the safe default is dry-run, should the flag's naming prioritize brevity/typing convenience (default-on dry-run, `--no-dry-run` to opt out) or consistency with how sibling commands in the same tool name their flags?
