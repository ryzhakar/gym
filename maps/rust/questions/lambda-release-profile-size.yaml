id: lambda-release-profile-size
text: Should a Rust AWS Lambda be built with a size-optimized release profile (`opt-level = "z"`, `lto = true`, `codegen-units = 1`, `panic = "abort"`, `strip`) rather than the default release profile, trading compile time and unwinding for binary size and cold start?
concepts:
- cargo-profiles
- lto
- panic-strategy
- binary-size
- cold-start
domains:
- cloud-workers
status: open
