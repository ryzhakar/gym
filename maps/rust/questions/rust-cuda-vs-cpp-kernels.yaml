id: rust-cuda-vs-cpp-kernels
text: For GPU kernel programming from Rust, should the ecosystem invest in a community-driven Rust-native toolchain (rust-cuda) rather than continuing to write kernels in C++/CUDA with a thin Rust host layer, given CUDA's vendor lock-in and rust-cuda's current feature gaps?
