id: middleware-hook-vs-typestate
text: Should a web framework provide a generic "runs on every request" middleware hook, or is it better to omit global middleware in favor of an explicit typestate pattern that forces handlers to obtain capabilities (like authorization) only by calling through the relevant subsystem?
concepts:
- middleware-request-hooks
- typestate-pattern
- request-handler-design
- authorization
domains:
- core
- web
status: open
