id: shared-model-crate-vs-domain-split
text: When a Bevy codebase grows past tens of thousands of lines and single-crate compile times become disruptive, should shared types be pulled into one low-level crate that everything depends on (simple, but the worst-case recompile unit), or should the codebase instead be split along domain lines to avoid any single always-recompiled root crate?
concepts:
- crate-splitting
- compile-times
- incremental-builds
- domain-driven-modularization
domains:
- other
status: open
