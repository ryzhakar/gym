id: expose-rustc-internals-rustdoc-json
text: When rustc has internal capability to correctly deduce information (implied trait bounds) that an external tool (cargo-semver-checks) cannot feasibly re-derive on its own, should that capability be exposed through a structured interface (rustdoc JSON) rather than left for external tools to approximate?
