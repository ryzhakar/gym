id: retain-joinhandles
text: Should Tokio's `spawn`, when the task's result isn't otherwise needed, routinely be fire-and-forget with the `JoinHandle` dropped (Tokio's own examples do this), or should every spawned task's `JoinHandle`/`JoinSet` be retained and polled so a panic inside it is never silently swallowed?
concepts:
- tokio-spawn
- joinhandle
- silent-panic-swallowing
- joinset
- structured-concurrency
domains:
- decentralized-iroh
status: open
