id: cpp-mutable-reference-representation
text: For C++ mutable references crossing into Rust (which, unlike Rust's `&mut`, are not guaranteed exclusive and can alias), should the FFI binding represent them as raw unsafe pointers, `Cell`-based interior mutability, or a new native non-exclusive C++-style reference type added to Rust?
concepts:
- reference-aliasing
- cell
- exclusivity
- field-projection
- auto-referencing
domains:
- core
status: open
