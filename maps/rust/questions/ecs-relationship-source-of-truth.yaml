id: ecs-relationship-source-of-truth
text: For an ECS relationship system, should the design enforce a single source of truth (only the `Relationship` component is authoritative, the reflected `RelationshipTarget` collection can't be populated directly), accepting that constraint in exchange for O(1) inserts and no runtime duplicate-scanning, or should both sides carry equal, symmetric authority for more flexibility at the cost of scanning/hashing to prevent duplicates?
