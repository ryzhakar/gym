id: llm-doc-edits-reproducibility
text: When using an LLM to bring doc-comment prose in a codebase to a consistent style, should the project make the process reproducible by pinning down and declaring exactly which model, prompt, and environment produced the edits, or should it instead adopt a formal controlled-language writing standard that constrains vocabulary/grammar enough to make the model's "taste" mostly irrelevant?
