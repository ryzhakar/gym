id: proc-macro-emitted-paths-hidden-deps
text: When a proc-macro conditionally emits a call into a crate (here, `tracing::instrument`) behind a feature flag inherited transitively through another crate's feature, should the macro hardcode an unqualified path that silently requires every downstream crate to independently declare that dependency in its own Cargo.toml, or should it use a fully-qualified/re-exported path so the hidden transitive requirement never surfaces as a downstream compile error?
