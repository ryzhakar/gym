id: ui-async-data-cache-vs-component
text: When a UI component needs asynchronously-fetched data to render, should that data live in a cache on a shared owner object (populated by a hover/eager prefetch, read synchronously at render), or should the component itself own the async fetch and render a loading state until it resolves?
