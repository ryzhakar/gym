id: gating-pre-1-0-dependency-integrations
text: For optional, pre-1.0 dependencies whose traits a crate implements, should the crate gate the exposure behind one coarse "unstable" feature flag, behind per-dependency (or per-dependency-version) feature flags, or simply drop the integration and re-add it only if users ask?
