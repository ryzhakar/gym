id: easy-mode-rust
text: When onboarding a team new to Rust on a security-critical project, should you write "easy mode Rust" (owned types instead of borrowed references, `Arc<RwLock<T>>` instead of lock-free structures) to keep the team approachable, or go straight for the most advanced/performant Rust idioms?
