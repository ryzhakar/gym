id: ui-dsl-vs-plain-rust
text: Should a Rust GUI framework define UI structure through a bespoke DSL with dedicated tooling (Slint's own language, Makepad's `live_design!` macro), or should it stick to plain Rust code with no macros/DSL (egui's immediate-mode API)?
