id: internal-hazmat-api-for-performance
text: When a crate's public API doesn't support an operation needed for performance (here, batch-hashing many small blobs with BLAKE3's SIMD `hash_many`), should a practitioner reach into the crate's internal/"hazmat" API and accept unchecked, precondition-violating footguns (silently wrong results rather than a panic on some platforms) for a large speedup, or stay within the safe public API and accept lower throughput?
