id: trace-context-propagation-mechanism
text: For propagating distributed-trace context (W3C trace-context HTTP headers) across a network boundary without modifying application code, should you use library interposition (`LD_PRELOAD` hijacking libcurl/libssl calls) or an eBPF-based mechanism (kernel-level header injection)?
