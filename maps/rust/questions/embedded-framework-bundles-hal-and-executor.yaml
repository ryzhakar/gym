id: embedded-framework-bundles-hal-and-executor
text: Should an embedded Rust concurrency solution bundle its own HAL and executor (batteries-included), or stay a framework-only layer that leaves HAL/PAC to the user and favors hardware-level resource exclusivity over software locking?
