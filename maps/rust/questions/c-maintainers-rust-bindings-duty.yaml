id: c-maintainers-rust-bindings-duty
text: When a C-subsystem maintainer changes their C code in a way that breaks the corresponding Rust abstraction/bindings, should the C maintainer be expected to help keep the Rust side correct (or at least not block small Rust-motivated robustness fixes to the C code), or is it legitimate for C maintainers to fix only their own C code and decline responsibility for Rust bindings entirely?
