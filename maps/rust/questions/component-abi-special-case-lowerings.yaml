id: component-abi-special-case-lowerings
text: In the Component Model's GC canonical ABI, should common shapes (e.g. `null` for `none`/`error`, a boolean `i32` for a no-payload `result`) get ad hoc special-cased lowerings for efficiency, or should the ABI stick to one regular, shape-driven lowering rule per component type?
