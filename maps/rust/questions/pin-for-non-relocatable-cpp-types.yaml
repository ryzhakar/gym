id: pin-for-non-relocatable-cpp-types
text: For C++ types that cannot be relocated via a simple memcpy (self-referential types, e.g. small-string-optimized `std::string`), should Rust FFI bindings represent them using `Pin`, given Rust's general assumption that all types are memcpy-movable?
concepts:
- pin
- move-constructors
- self-referential-types
- memcpy-movability
domains:
- core
status: open
