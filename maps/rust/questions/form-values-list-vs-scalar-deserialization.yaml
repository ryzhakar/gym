id: form-values-list-vs-scalar-deserialization
text: When a UI framework's form-submission API hands back untyped, string-keyed values (e.g. a `HashMap<String, Vec<String>>`) for deserialization into a caller-defined struct via serde, should the ambiguity between a single value and a multi-value field (e.g. a multi-select) be resolved by an explicit schema/cardinality marker in the data, or by a permissive/heuristic deserializer that infers list-vs-scalar from the observed value count per field?
concepts:
- serde-deserialization
- generic-untyped-form-data
- ambiguous-cardinality
- api-ergonomics-vs-correctness
domains:
- frontend
status: open
