id: ecs-ui-large-vs-small-systems
text: For complex UI built on an ECS with an immediate-mode UI library (egui), should you write large systems with many queries in one place (simpler control flow, but they frequently deadlock against the borrow checker), or split into many small per-widget systems (fewer conflicts per system, but requires repeated manual world/state access that itself risks borrow-checker errors)?
