id: ecs-relationship-type-level-exclusivity
text: Should an ECS's relationship "edge" components be public types with the exclusivity (one-to-one, one-to-many, many-to-many, ...) encoded at the type level for compile-time correctness and ergonomics, or should the edge-storing components be private (mutable only via commands/hooks) with a single consistent query API regardless of exclusivity?
