id: ui-state-scoped-lifetimes-vs-runtime-handles
text: 'Should a Rust UI/reactive framework model component state with borrow-checker-scoped lifetimes tied to the component (arena/bump allocation: zero-clone access in event handlers, but confusing lifetime errors and incompatible with `''static` futures), or with a runtime-tracked `Copy` handle backed by generational/GC-like reclamation (uniform across closures, futures and threads, at the cost of adding a small runtime-tracking layer)?'
concepts:
- component-state-model
- arena-bump-lifetimes
- copy-handles
- generational-indices
- futures-static-bound
domains:
- frontend
status: open
