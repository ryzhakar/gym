id: expose-fixed-array-vs-wrapper-type
text: When a fixed-size array (e.g. `[u8; 6]`) might later need to hold a same-shaped but larger variant (e.g. an 8-byte IEEE MAC), should the API expose the array type directly, or return a slice / wrap it in a dedicated type to keep the door open?
