id: custom-wasm-target-vs-wasi
text: when the goal is running an existing, unmodified Rust/Linux program (with threads, filesystem, subprocesses) inside a sandbox, should you target the standardized WASI Rust targets (wasm32-wasip1/2/3), or define and require a custom, non-standard Rust target tailored to the sandbox's own syscall/threading model?
