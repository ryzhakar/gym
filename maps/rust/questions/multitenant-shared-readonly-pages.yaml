id: multitenant-shared-readonly-pages
text: in a multi-tenant sandboxed runtime, should tenants share read-only memory pages (e.g. a JS engine's read-only heap) for efficiency, or should each tenant get fully isolated memory, given the side-channel risk (ASLR, Spectre-style timing attacks) shared pages introduce?
concepts:
- multi-tenant-isolation
- memory-sharing
- side-channel-attacks
- sandboxing
domains:
- cloud-workers
- core
- distributed
status: open
