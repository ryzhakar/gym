id: web-session-store-default
text: Should a Rust web framework default new apps to a client-side (encrypted + signed cookie) session store for low-friction onboarding, or push toward a server-side session store (e.g. via `tower-sessions`) because client-stored session data cannot be force-invalidated or have permissions changed on the fly?
concepts:
- sessions
- cookies
- tower-sessions
- request-context
- encryption
- security
- replay-attacks
domains:
- web
status: open
