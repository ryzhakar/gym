id: silent-fallback-vs-explicit-error
text: When something expected is missing or ambiguous (caller input, handler context, an embedded asset), should code fail explicitly (an error, a panic, a failed build) or fall back silently to a default (pick the first, `unwrap_or_default`, serve a 404)?
concepts:
- fail-loud-vs-silent-fallback
- explicit-error-handling
- surprising-behavior
- build-time-vs-runtime-failure
- error-handling
- panics
- option-unwrap
- context-dependency-injection
- defaults
domains:
