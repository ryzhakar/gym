id: emulate-specialization
text: when a type needs specialization-like behavior (methods gated on stronger trait bounds, e.g. `Read+Write+Seek` vs `Read+Seek`) but Rust's real specialization is unstable, do you fake it with a runtime-checked field set from trait-bound-gated impl blocks, or reach for a different pattern entirely?
