id: ecs-events-first-architecture
text: In a growing Bevy/ECS game, should cross-system state changes flow through an events/observers-first architecture (systems never mutate each other's state directly) rather than direct shared mutable access, accepting the loss of transactional rollback and added boilerplate in exchange for decoupling?
