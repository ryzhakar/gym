id: behavioral-equivalence-testing-method
text: For verifying that a rewritten/ported system stays behaviorally equivalent to the original when correct behavior includes emergent, hard-to-specify effects (e.g. a physics-engine exploit), should you rely on unit/integration tests, naive property-based (fuzzing) testing, or a heuristic-guided reinforcement-learning search?
