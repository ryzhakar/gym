id: reuse-vs-purpose-built-unwind
text: When a new profiling/debugging feature needs stack unwinding, should it reuse and refactor the codebase's existing general-purpose unwind implementation (more consistent, avoids duplicated maintenance) even where that path is much slower, or should it ship a separate, purpose-built implementation optimized for the feature's own constraints (faster, but duplicates unwind logic)?
concepts:
- code-reuse-vs-duplication
- stack-unwinding
- frame-pointer-walking-vs-dwarf-unwinding
- maintenance-burden-vs-performance
domains:
- embedded
status: open
