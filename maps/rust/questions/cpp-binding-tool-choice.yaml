id: cpp-binding-tool-choice
text: For binding a large existing C++ API surface to Rust, should you use a low-level C-ABI-only generator (bindgen/cbindgen), a manually-declared bridge macro with boxed indirection (CXX), a hand-written interface-description-language with explicit layout control ("Zengar"), or native compiler integration across clang and rustc (Crubit)?
