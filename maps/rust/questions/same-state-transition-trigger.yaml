id: same-state-transition-trigger
text: For a component that triggers on a state-machine transition matching a predicate, should a transition into the same state the entity is already in be treated as a no-op (never triggering), or should it be allowed to trigger, to support "reload" style use cases?
concepts:
- state-machines
- state-transitions
- ecs-state-scoped-entities
domains:
