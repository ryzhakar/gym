id: incremental-invalidation-redesign
text: Should the Rust compiler's/Cargo's incremental-rebuild invalidation be redesigned around explicit "atomic level" targets (AST/HIR/MIR/codegen) plus separately-tracked data dependencies (e.g. codegen flags), instead of today's coarser per-flag/per-command invalidation?
