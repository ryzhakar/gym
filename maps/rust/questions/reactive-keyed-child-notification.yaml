id: reactive-keyed-child-notification
text: When a reactive container's parent field is written as a whole (replaced or patched), should the reactivity system notify all of its keyed-child subscriptions by default (accepting some unnecessary re-notifications), or should notification require writing through the specific keyed accessor (precise, but silently misses updates if the user writes the parent instead)?
concepts:
- fine-grained-reactivity
- signal-trigger-graph
- keyed-derived-signals
- false-positives-vs-false-negatives-in-change-notification
domains:
- frontend
status: open
