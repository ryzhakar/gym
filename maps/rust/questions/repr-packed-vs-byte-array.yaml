id: repr-packed-vs-byte-array
text: When a struct's fields need a smaller in-memory footprint than natural alignment would otherwise give, should Rust code use `#[repr(packed)]` to force the tight layout (concise, but taking a reference to a misaligned field is undefined behavior), or should it store the fields packed into a raw byte array and expose them through typed accessor methods (safer, more verbose, same codegen)?
