id: nonnull-in-ffi-params
text: In FFI/wasm-bindgen-style APIs, should a safety-encoding wrapper type like `NonNull<T>` be accepted as a parameter even when it forces a runtime null check, or should the API stick to raw pointer types to avoid the check?
