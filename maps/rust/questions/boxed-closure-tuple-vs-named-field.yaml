id: boxed-closure-tuple-vs-named-field
text: When a public API wraps a `Box<dyn Fn>` behind a required constructor function, should the wrapped closure live in an unnamed tuple-struct field or a named field, given that a constructor already replaces the field's main ergonomic argument (avoiding `Box::new` at call sites)?
