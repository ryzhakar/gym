id: leaky-signal-abstraction-electrical-config
text: Should an embedded HAL's peripheral-signal abstraction expose electrical-configuration details (drive strength, pull resistors, input/output mode) on the signal type itself, even though this leaks device-specific configuration into what is meant to be a clean peripheral-routing abstraction?
