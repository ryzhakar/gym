id: ecs-relationship-fragmenting
text: Should ECS relationships be stored as archetype-fragmenting edges (entities with different relationship targets end up in different archetypes, enabling wildcard/nested-join/traversal query operations), or as non-fragmenting components (all related entities can share the same archetype/table, favoring dense cache-friendly iteration for common hierarchical cases)?
