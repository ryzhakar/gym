id: component-map-duplicate-keys
text: When lifting/lowering a component-model `map<K,V>` value with duplicate keys, should bindings generators be required to normalize to a defined winner (e.g. last-key-wins), should the spec instead mandate key uniqueness as an enforced boundary constraint, or should a host be permitted but not required to deduplicate, leaving the behavior non-deterministic?
