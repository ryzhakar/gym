id: wasm-precise-traps-store-tearing
text: On hardware with "store-tearing" behavior, where a partial store can have observable side effects before trapping, should a WebAssembly runtime pay a load-before-store performance cost to guarantee precise, spec-compliant trap semantics, or accept imprecise traps as an acceptable, mostly theoretical risk on rare/low-power hardware?
