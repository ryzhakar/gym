id: futures-crate-vs-alternatives
text: Should a Rust library depend on the mainline `futures` crate for complex combinators (e.g. `FuturesUnordered`) despite known bugs in that unsafe-heavy code, or should it avoid `futures` altogether and assemble the needed functionality from several smaller alternative crates (futures-lite, futures-buffered, futures-util) at the cost of ergonomics and discoverability?
