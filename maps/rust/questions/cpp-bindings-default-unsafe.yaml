id: cpp-bindings-default-unsafe
text: When binding C++ APIs whose safety depends on undocumented preconditions, should every C++ function be marked `unsafe` in Rust by default, or should the binding rely on C++-side safety annotations plus type-based heuristics to mark functions safe where possible?
