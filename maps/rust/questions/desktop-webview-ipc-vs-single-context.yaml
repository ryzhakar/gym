id: desktop-webview-ipc-vs-single-context
text: For a Rust desktop app that needs a web-capable UI, should the frontend logic stay in the same Rust execution context as the backend (Dioxus-style, calling straight into the WebView glue), or should it run as an independent frontend runtime talking to a host process over a serialized IPC boundary (Tauri's architecture)?
