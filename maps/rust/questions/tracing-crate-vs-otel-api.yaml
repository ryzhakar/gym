id: tracing-crate-vs-otel-api
text: For distributed tracing in Rust, should the ecosystem standardize on the widely-adopted `tracing` crate (Tokio's tracing API), on the OpenTelemetry-spec-compliant tracing API, or keep maintaining both with improved interop?
