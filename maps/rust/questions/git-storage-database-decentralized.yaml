id: git-storage-database-decentralized
text: For hosting large monorepos, should Git object storage move off the traditional filesystem-based backend and into a distributed database (as Google Piper/Meta Sapling do), combined with decentralizing hosting itself rather than relying on a centralized host like GitHub?
