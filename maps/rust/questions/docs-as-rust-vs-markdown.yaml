id: docs-as-rust-vs-markdown
text: When migrating a documentation/blog site's content out of a JS-based static-site generator's Markdown-derivative format, should the content be authored directly as Rust source (a DSL enabling compile-time link validation and cross-version deduplication) or kept close to Markdown for editor tooling and authoring ergonomics, with a lighter embedding mechanism for interactive components?
