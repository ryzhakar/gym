id: coupled-debug-accessor-vs-primitive
text: When a runtime needs to expose a narrow debugging capability that would be most efficient as a purpose-built accessor coupled to internal layout details, should the maintainers accept that coupled accessor (even once made asymptotically efficient), or insist on a smaller, decoupled, general-purpose primitive that pushes the assembling logic (and any inefficiency) out to the caller?
concepts:
- api-surface-minimalism
- internal-layout-coupling
- debugging-apis
- encapsulation
domains:
