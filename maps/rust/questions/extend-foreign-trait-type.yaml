id: extend-foreign-trait-type
text: When a foreign trait's shared type (e.g. `embedded_hal::spi::Operation`) can't expose the hardware-specific capability a HAL needs, should the HAL define its own parallel type (accepting API duplication and a breaking change) to extend, or add narrowly scoped extension methods that leave the foreign type untouched?
