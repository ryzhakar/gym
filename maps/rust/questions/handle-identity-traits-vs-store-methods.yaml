id: handle-identity-traits-vs-store-methods
text: When a wrapper/handle type's "true" identity requires dereferencing store-owned state that isn't safely reachable from the handle alone, should identity comparison be implemented as the standard `PartialEq`/`Eq`/`Hash` traits on the bare handle, or as separate methods that take an explicit store borrow?
concepts:
- trait-based-equality
- store-scoped-state
- handle-types
- identity-keys
domains:
- core
- wasm
status: open
