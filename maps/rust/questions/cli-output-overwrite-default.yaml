id: cli-output-overwrite-default
text: Should a CLI tool that repeatedly writes an output file overwrite the same filename by default (simpler, faster iteration, matches a peer tool's behavior), or auto-generate a timestamped filename by default to avoid silently discarding a previous result?
concepts:
- cli-ux
- default-behavior
- data-loss-avoidance-vs-iteration-convenience
domains:
- embedded
status: open
