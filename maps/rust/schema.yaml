# The Rust map's data schema (draft). `scripts/map/check_map.py` reads this file;
# nothing else declares a kind, a field, an enum or a relation.
#
# Every entity file's `id` equals its filename stem. Fields not listed under a
# kind are refused. `checks/<entity-id>.yaml` is the one non-entity home: it
# holds a list of check records, no `id` of its own — see `list: true` below.

kinds:
  question:
    home: questions
    required: [text, concepts, domains, status]
    fields:
      text: {type: string}
      concepts: {type: list, relation: concept}
      domains: {type: list, relation: domain}
      status: {type: enum, values: [open, closed]}
      notes: {type: string}

  position:
    home: positions
    required: [question, summary, tag]
    fields:
      question: {type: string, relation: question}
      summary: {type: string}
      tag: {type: enum, values: [fact, tradeoff, taste]}
      advocates: {type: map}
      tells: {type: list}

  argument:
    home: arguments
    required: [position, side, text, values]
    fields:
      position: {type: string, relation: position}
      side: {type: enum, values: [for, against]}
      text: {type: string}
      values: {type: list, relation: value}
      sources: {type: list, relation: source}

  value:
    home: values
    required: [text]
    fields:
      text: {type: string}

  voice:
    home: voices
    required: [name, type, track_record]
    fields:
      name: {type: string}
      type: {type: enum, values: [builder, educator, language-designer, institution, critic, leaver]}
      track_record: {type: list}
      influence: {type: list}

  claim:
    home: claims
    required: [voice, position, source, date, locator, paraphrase]
    fields:
      voice: {type: string, relation: voice}
      position: {type: string, relation: position, allow: [unresolved]}
      source: {type: string, relation: source}
      date: {type: date}
      locator: {type: string}
      paraphrase: {type: string}
      quote: {type: string, max_chars: 300}
      practiced: {type: enum, values: ["true", "false", unknown]}
      gap: {type: string}
      superseded_by: {type: string, relation: claim}
      # checked: when this Claim's quote/date was checked against its Source, by what method, and whether it was confirmed as-is or corrected.
      checked: {type: map}

  source:
    home: sources
    required: [url, title, kind, date, language]
    fields:
      url: {type: string}
      title: {type: string}
      kind: {type: enum, values: [post, talk, script, rfc, thread, code, package, book, survey]}
      date: {type: date}
      language: {type: enum, values: [en, zh, de, fr, uk]}
      voice: {type: string, relation: voice}
      frame: {type: map}

  convention:
    home: conventions
    required: [position, prevalence]
    fields:
      position: {type: string, relation: position}
      prevalence: {type: list}
      dissent: {type: list, relation: claim}

  domain:
    home: domains
    required: [text]
    fields:
      text: {type: string}

  concept:
    home: concepts
    required: [text]
    fields:
      text: {type: string}
      related: {type: list, relation: concept}
      merged_into: {type: string, relation: concept}

  check:
    home: checks
    list: true
    required: [check, run_a, run_b, agree]
    fields:
      check: {type: enum, values: [fill-position, fill-tag, paired-cases, itt, merge, judge]}
      run_a: {type: map}
      run_b: {type: map}
      run_c: {type: map}
      agree: {type: bool}
      resolution: {type: enum, values: [majority, adjudicated, unresolved]}
      grader: {type: map}
