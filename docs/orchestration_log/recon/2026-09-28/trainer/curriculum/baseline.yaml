# Stage 0 baseline set: specs only (P2). P3 authors the items; no Rust here.
# Author: opus, 2026-09-28. Refs as in curriculum/rust.yaml.
#
# Purpose: the value T3 is read against (N1-r3-02, 4 1 1, EV:82), and the
# unit 1 selection rule (rust.yaml rules.unit_1_selection). This is a
# selection rule, not a diagnosis (FP:139).

session:
  cap_minutes: 15            # PLAN:48
  per_item_soft_cap_minutes: 2.5   # 15 / 6; default, unmeasured
  run_by: script (P6 probe runner); trainer not running (PLAN:48, FP:32)
  allowed: cargo, rustc and its error messages, rustc --explain; no web, no LLM, no docs site. Same allowance as the probes (default, unmeasured; P6 sets it for both)
  on_cap: unfinished items are logged pass=false, attempts as made, `skipped` when untouched (FP:35)
  log_per_item: [item id, cluster, form, pass, continuous, minutes, attempts]   # PLAN:89; continuous beside pass/fail per EV:1091
  item_constraints:
    - std only, no external crates
    - one crate per item under the P6 workspace
    - each item names its cluster's mechanism and no other cluster's, so a failure points at one cluster. Iterators need closures and traits, so the iter item keeps its trait use to std's Iterator only (default, unmeasured)
    - sized to pass in ≤2.5 min for a learner who has the mechanism (default, unmeasured; minutes logged give a figure)
  forms:
    predict-output: learner writes the exact stdout of a given program before running it; running it is disallowed until the prediction is submitted
    fix-the-compile-error: a crate that fails `cargo build` with one error of the cluster's kind; learner edits until tests pass; the test file and the marked signatures are locked
    write-to-tests: a stub and a visible test file; learner implements until tests pass

items:
  - id: b1-own
    cluster: ownership-borrowing
    form: fix-the-compile-error
    tests: >-
      The learner reads a move or borrow-conflict error (use after move; a
      shared and a mutable borrow alive together) and fixes it by
      restructuring the ownership, not by deleting the use.
    pass: >-
      `cargo test` green; locked test file and signatures unchanged (checked
      by hash); held-out test green. The held-out test exercises the value
      that was moved or borrowed, so deleting its use fails.
    continuous: compile errors left at stop; fraction of tests passed

  - id: b2-life
    cluster: lifetimes
    form: fix-the-compile-error
    tests: >-
      The learner reads a lifetime error (missing lifetime specifier on a
      function returning a reference; or a borrow that does not live long
      enough) and fixes it with an annotation or a scope change.
    pass: >-
      `cargo test` green; locked test file and signatures unchanged, except
      where the item marks a signature as the edit site; held-out test
      green. Returning an owned value in place of the reference is refused
      by a locked return type.
    continuous: compile errors left at stop; fraction of tests passed

  - id: b3-result
    cluster: result-question-mark
    form: write-to-tests
    tests: >-
      The learner writes a function that calls two fallible std operations
      and propagates the error with `?`, mapping or converting error types
      where needed; no panics on bad input.
    pass: >-
      visible and held-out tests green; the held-out tests include an Err
      case for each fallible step. Any unwrap or expect in the solution
      fails the item, checked by grep over the edited file.
    continuous: fraction of tests passed (visible + held-out)

  - id: b4-traits
    cluster: traits-generics
    form: write-to-tests
    tests: >-
      The learner writes one generic function with a trait bound and
      implements a small trait for two types, so one call site works for
      both.
    pass: >-
      visible and held-out tests green; the held-out test calls the generic
      function with a type the visible tests did not use, so concrete-type
      special cases fail.
    continuous: fraction of tests passed (visible + held-out)

  - id: b5-iter
    cluster: iterators-closures
    form: predict-output
    tests: >-
      The learner traces a chain of iterator adapters with side-effecting
      closures: laziness (nothing runs before a consumer), per-element
      interleaving of adapters, and a closure capturing and mutating an
      outer variable.
    pass: predicted stdout equals actual stdout exactly, after trailing whitespace is normalized
    continuous: per-line edit distance between prediction and actual (PLAN:89)

  - id: b6-enum
    cluster: enums-match
    form: predict-output
    tests: >-
      The learner traces a match over an enum with data-carrying variants,
      a guard, arm order that matters, and a binding with `@` or a nested
      pattern.
    pass: predicted stdout equals actual stdout exactly, after trailing whitespace is normalized
    continuous: per-line edit distance between prediction and actual (PLAN:89)

ties_to_probes: >-
  T3 reads delayed probes "above the same-form baseline" (PLAN:17). Each
  mechanism unit's probe set therefore includes at least one item in its
  cluster's baseline form: u01 and u07 fix-the-compile-error; u04
  fix-the-compile-error; u03 write-to-tests; u05 and u08 write-to-tests; u06
  predict-output; u02 predict-output. Rule for P3 (default, unmeasured).

declared_limits:
  - One item per cluster, so a cluster reads as 0 or 1. Selection noise is high, and a single slip decides unit 1.
  - Cluster and form are confounded, since each cluster is tested in one form. A cluster may fail because of the form, for example predict-output being harder than write-to-tests.
  - The pass rules for fix-the-compile-error rest on locks and held-out tests. A learner can still pass by an unintended restructure. The isomorph and blind-solve checks in P3 (PLAN:74) catch the obvious cases only.
  - Baseline to post-test gain is confounded by everything (PLAN:131).
