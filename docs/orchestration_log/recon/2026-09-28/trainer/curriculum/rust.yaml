# Rust curriculum v0 (P2). Author: opus, 2026-09-28. Provisional: every id comes
# from MAP v0.1, which is ungraded and thin (MAP/README.md, "Declared limits").
# Checked by curriculum/check.py.
#
# Refs (cite as REF:line):
#   PLAN  = docs/orchestration_log/recon/2026-09-28/trainer/fable-plan.md
#   FP    = docs/orchestration_log/recon/2026-09-27/research/teaching/synthesis/first-protocol.md
#   EV    = docs/orchestration_log/recon/2026-09-27/research/teaching/synthesis/evidence-map-v3.md
#   MAP   = maps/rust/
#
# Unit fields per PLAN:73: id, kind, concepts, question (judgment only), domain,
# form, revisit_at_days. Four fields added:
#   cluster  the baseline cluster a mechanism unit trains; the baseline
#            selection rule uses it (PLAN:48, O5 at PLAN:111).
#   after    unit ids this unit rests on. The list order is a topological sort
#            of `after`. The dependencies are read off Rust's semantics
#            (default, unmeasured). Strict prerequisite order can be wrong
#            (N2-r4-08, 1 1 0, SURVEYED, EV:224).
#   status   judgment units only: `needs-arguments` until MAP/arguments/ gives
#            the Question's Positions Arguments (task rule; PLAN:59 Stage 1).
#   gap      where MAP lacks a Concept the unit needs. The gap is declared,
#            never filled by a made-up id.

map: {path: maps/rust, version: v0.1, provisional: true}

forms:
  attempt-first:
    kind: mechanism
    steps:
      - attempt: 10 min unaided, with the compiler; trainer silent (PLAN:49). Where the problem admits more than one approach, the attempt asks for at least two (fidelity condition "multiple attempts", EV:239; magnitudes unusable)
      - instruction: one subgoal-labeled worked example; step groups named by subgoal, tied to what the attempt did
      - reuse: 2 problems reusing the example's subgoals
      - unshown: 1 problem needing a component the example did not show
      - probe-immediate: 3 held-out isomorphic items, trainer closed, 10 min cap (PLAN:50)
    grounds:
      - subgoal-labeled worked examples, then reuse and unshown-component tasks — N2-r1-05 (3 3 2), N2-r1-06 (3 3 2); FP:52. Scope: both arms were worked examples, silent on order relative to an attempt (EV:1089); held on quizzes, not exams, at semester scale (N2-r1-07, SURVEYED, EV:186)
      - attempt before instruction, instruction built on the attempt — N2-r1-10 (4 2 1), N3-r1-02 (4 2 2); FP:53. Fidelity conditions and "adults undetermined" (EV:1088); the LLM default breaks the mechanism (N7-r2-01, EV:1088)
      - Rust mechanisms are domain-specific, not domain-general, so the reversal clause of FP:53 does not apply (default, unmeasured)
  judgment-drill:
    kind: judgment
    steps:
      - scenario: a case in the unit's domain that raises the Question
      - take: the learner takes a Position, gives Arguments, names Values
      - grade: two fresh sonnets, swapped order, rubric = the Question's Arguments in MAP; disagreement → unresolved (O10, PLAN:116)
    grounds:
      - T7 (PLAN:21), Goal 1 alignment clause. No learning-outcome evidence for this form (default, unmeasured)

rules:
  default_order: >-
    The list order below. It is a topological sort of `after`. Ties between
    units at equal dependency depth are broken by the order written (default,
    unmeasured).
  unit_1_selection: >-
    Baseline gives one item per cluster, so each cluster passes or fails.
    Unit 1 is the first unit in default order whose cluster failed and whose
    items exist under trainer/items/<unit>/. If none qualifies, unit 1 is
    u01. The rest follow default order. This is a selection rule, not a
    diagnosis (PLAN:48; FP:139, no adapting on an unverified diagnosis; N4-r2-05/06
    structured items hold, EV:351). Deviation from O5 (PLAN:111): O5 says
    "lowest pass". The restriction to authored units keeps session 0 from
    waiting on authoring. P3's Stage 0 set is u01–u03, so failed clusters
    life, trait and iter cannot become unit 1 until their units are authored.
  eligibility: >-
    A unit is eligible when every unit in `after` has had its practice
    session, or its cluster passed baseline. A judgment unit is also
    eligible only once status is not needs-arguments. An ineligible unit is
    skipped, and the queue takes the next eligible one.
  interleave: >-
    From the second unit on, the practice problems in a session mix problem
    types from all practiced units, mechanism and judgment; type = unit id;
    never two consecutive of one type. N2-r1-02 / N2-r7-01 (3 1 2, K-12 field RCT);
    lab-only in motor skills, applied −0.01 (N2-r5-06, EV:200; EV:1108);
    FP:54. Needs from P3: at least one unused practice item (for a judgment
    unit, an unused scenario) per earlier unit per session it is interleaved
    into.
  spacing: >-
    revisit_at_days counts from the unit's practice session. Day 7 is the one
    delayed probe on isomorph b, scored for T3 (O3, PLAN:109; FP:34). Days 30
    and 90 are revisit practice, interleaved and not scored for T3, because a
    probe relearns (N1-r3-06, UNVERIFIABLE, EV:85; PLAN:97). Month-scale
    gaps for multi-month retention: N2-r1-01 (4 1 2, lab verbal recall),
    FP:55. The gain holds at equal study time (N2-r7-04, 4 1 2, EV:208). The
    values 7/30/90 are default, unmeasured. Stage 1 resizes the queue to the
    retention target (PLAN:59).
  log_form: >-
    Every session row records the unit's form, so a probe failure can be tied
    to a form (FP:56).
  not_claimed: >-
    No part-task or whole-task order is claimed as evidence-backed (FP:57;
    N2-r4-01/02 UNVERIFIABLE, EV:1110). No N2 checklist item is shown to
    work for an adult learning a CS-adjacent skill measured at ≥7 days
    (EV:247). Every rule here is a hypothesis under test (PLAN:133).
  concept_choice: >-
    A mechanism unit's concepts are the MAP ids whose text names the
    cluster's mechanism. Concept frequency across Questions is not read as
    importance (O12, PLAN:118). A judgment unit's concepts are its Question's
    concepts that also appear in the units reachable through `after`.
  question_choice: >-
    A judgment Question must be in domain core, have ≥2 Positions, and share
    concepts with trained units. Preferred: more baseline clusters covered
    across the judgment set; then all Positions tagged tradeoff; then more
    Claims (default, unmeasured). Considered and not taken:
    lifetimes-on-structs (one Position tagged fact),
    library-error-type-opaque-vs-typed (anyhow, thiserror, snafu: crates no
    unit trains), unchecked-unwrap-vs-safe-abort (wasm and embedded code-size
    framing). No iterators or closures Question has ≥2 Positions in core.

units:
  - id: u01-own-move-borrow
    kind: mechanism
    cluster: ownership-borrowing
    concepts: [ownership, move-semantics, borrowing, borrow-checker, copy-vs-clone]
    domain: core
    form: attempt-first
    revisit_at_days: [7, 30, 90]
    after: []

  - id: u02-enums-match
    kind: mechanism
    cluster: enums-match
    concepts: [enums, sum-types, pattern-matching, pattern-matching-2, exhaustive-match, option-semantics]
    domain: core
    form: attempt-first
    revisit_at_days: [7, 30, 90]
    after: []
    gap: pattern-matching and pattern-matching-2 are one Concept under two ids (texts "pattern-matching", "pattern matching"); both kept, merge is MAP's job. match-ergonomics left out, since it needs references (u01).

  - id: u03-result-question-mark
    kind: mechanism
    cluster: result-question-mark
    concepts: [error-handling, error-propagation, explicit-error-handling, option-unwrap, panics]
    domain: core
    form: attempt-first
    revisit_at_days: [7, 30, 90]
    after: [u02-enums-match]
    gap: MAP has no Concept for `Result` itself or for the `?` operator; error-propagation is the nearest id.

  - id: u04-lifetimes
    kind: mechanism
    cluster: lifetimes
    concepts: [lifetimes, ownership-lifetimes, owned-vs-borrowed-types, nll]
    domain: core
    form: attempt-first
    revisit_at_days: [7, 30, 90]
    after: [u01-own-move-borrow]
    gap: no Concept for lifetime elision or `'static` bounds in core; subtyping-variance left out as beyond first contact.

  - id: u05-generics-traits
    kind: mechanism
    cluster: traits-generics
    concepts: [generics, traits, trait-bounds, monomorphization, associated-types]
    domain: core
    form: attempt-first
    revisit_at_days: [7, 30, 90]
    after: [u01-own-move-borrow]
    gap: associated-types and associated-types-2 are one Concept under two ids; associated-types kept (the id generics-vs-dyn-for-abstraction uses).

  - id: u06-closures-iterators
    kind: mechanism
    cluster: iterators-closures
    concepts: [closures, eager-vs-lazy-materialization]
    domain: core
    form: attempt-first
    revisit_at_days: [7, 30, 90]
    after: [u01-own-move-borrow, u05-generics-traits]
    gap: MAP has no iterator Concept (only dataset-iterator-abstractions, ML-specific, left out) and no Fn/FnMut/FnOnce Concept. This is the thinnest unit; P3 authors from Rust semantics, not from MAP text.

  - id: u07-shared-ownership
    kind: mechanism
    cluster: ownership-borrowing
    concepts: [box, rc, refcell, arc, interior-mutability]
    domain: core
    form: attempt-first
    revisit_at_days: [7, 30, 90]
    after: [u01-own-move-borrow, u05-generics-traits]

  - id: u08-trait-objects
    kind: mechanism
    cluster: traits-generics
    concepts: [trait-objects, dyn-trait, static-vs-dynamic-dispatch, impl-trait]
    domain: core
    form: attempt-first
    revisit_at_days: [7, 30, 90]
    after: [u05-generics-traits, u07-shared-ownership]
    gap: dispatch is split across near-duplicate ids (dynamic-dispatch, dynamic-dispatch-2, dyn-trait-objects, trait-objects-2, static-vs-dynamic-dispatch-2); one of each kept.

  - id: u09-j-shared-mutable-state
    kind: judgment
    question: shared-mutable-state-vs-explicit-passing
    concepts: [interior-mutability, arc, ownership, box, rc, refcell, borrow-checker]
    domain: core
    form: judgment-drill
    revisit_at_days: [7, 30, 90]
    after: [u01-own-move-borrow, u07-shared-ownership]
    status: needs-arguments

  - id: u10-j-generics-vs-dyn
    kind: judgment
    question: generics-vs-dyn-for-abstraction
    concepts: [static-vs-dynamic-dispatch, traits, associated-types, trait-objects, dyn-trait, generics, monomorphization]
    domain: core
    form: judgment-drill
    revisit_at_days: [7, 30, 90]
    after: [u05-generics-traits, u08-trait-objects]
    status: needs-arguments
    gap: MAP/README.md "Known issues" lists this Question among 7 with a suspected duplicate Position. The compiled map holds 2 Positions of opposite direction (static-by-default; p2, dyn for wasm code size).

  - id: u11-j-library-panic
    kind: judgment
    question: library-panic
    concepts: [error-handling, panics]
    domain: core
    form: judgment-drill
    revisit_at_days: [7, 30, 90]
    after: [u03-result-question-mark]
    status: needs-arguments
    gap: one of 5 Positions (no-ad-hoc-panics) is tagged taste; the map gives no verdict on taste, so graders score Arguments given, not the Position taken.

  - id: u12-j-enum-vs-dyn
