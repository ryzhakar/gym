unit: u04-lifetimes
author: hints author (opus) for trainer-u3, 2026-10-30
ladder: >-
  Level 1 points at the evidence, level 2 names the subgoal from example.md
  where the miss sits, level 3 states the Rust rule at stake. No level names a
  change or carries code from key/, and no level of the predict problem gives
  any case's answer. The trainer gives a supplied hint before composing its
  own, and escalates a level only after a failed attempt at the level before
  (.claude/agents/gym-trainer.md, respond-to-a-request). The three-level shape
  is default, unmeasured.
probes: none; probe-a and probe-b are unaided
compile:
  scope: unit
  note: Used first whenever the build is red, before the problem's own ladder.
  hints:
    - level: 1
      text: Run cargo check and read only the first error, its code, the line it names, and its label.
    - level: 2
      text: Run rustc --explain with that code. Which type does the compiler say it expected at that spot, and which did your code give?
    - level: 3
      text: The fix makes the expected and given types meet at that spot, either by changing what the code gives or by converting it there. Every other error is ignored until this one is gone.
problems:
  attempt:
    scope: src/lib.rs
    note: The trainer gives level 1 only after the attempt (gym-trainer.md, respond-to-a-request); this ladder serves a request made after it.
    hints:
      - level: 1
        text: Read each error in full, including one reported inside tests/visible.rs, and the function it concerns. For that function, list every value its body can return and the parameter each value is a piece of.
      - level: 2
        text: Subgoal 2, name that link in the signature. An error in tests/visible.rs sits in a caller, but the fault is in a signature that claims a link the body never makes, or leaves out one it does.
      - level: 3
        text: Elision supplies an output lifetime only when there is exactly one input reference, or a self reference. A named lifetime on the output says the result may borrow from every parameter carrying that same name, and the compiler keeps each of those parameters borrowed for as long as the result is used.
  reuse-1:
    hints:
      - level: 1
        text: In each case, find every reference that is returned or used after a later line, and trace it back to what it borrows from, a parameter, a local, or a literal. Then look for any line that changes or borrows the same value while that reference is still to be used.
      - level: 2
        text: Subgoal 1, find where the returned reference comes from, for the cases that return a reference; subgoal 4, make the borrow end before the conflict, for the cases that borrow a parameter and then change it.
      - level: 3
        text: Elision ties an output reference to the one input reference, and has nothing to tie it to otherwise; a reference to a value owned by the function cannot leave it. A borrow lasts until its last use, not to the end of the block. While a shared borrow is still to be used, nothing may change what it borrows, and two mutable borrows of the same value may not overlap.
  reuse-2:
    hints:
      - level: 1
        text: Read which tests fail to compile and the variable each error names. Every one of them uses the result of main_value after the header itself is gone.
      - level: 2
        text: Subgoal 3, carry the lifetime through a struct, after subgoal 1. The text main_value returns is a piece of something; decide whether that something is the Header value or the line it was parsed from.
      - level: 3
        text: A struct holding a reference declares a lifetime, and its impl declares the same one. A method whose output lifetime is elided borrows from its self reference, so its result cannot outlive the struct value, whatever the body returns. The lifetime declared on the struct is the only name for the data the struct holds.
  reuse-3:
    hints:
      - level: 1
        text: Each error carries three labels. Read where the first borrow is taken, where the conflicting push or change happens, and where the first borrow is used again.
      - level: 2
        text: Subgoal 4, make the borrow end before the conflict. spec.md rules out an owned copy, so the order of the lines is all that is left.
      - level: 3
        text: A borrow lasts until its last use, not to the end of the block. While a shared borrow of the vector is still to be used, nothing may change the vector; while a mutable borrow of one element is still to be used, no other borrow of the vector may be taken. Each function must still return what its doc comment states, which fixes what each value has to be read from.
  reuse-4:
    hints:
      - level: 1
        text: Read the message of tests/structure.rs for each word it counts. Once those words are gone, read the compiler's first error, and the test in tests/visible.rs whose value outlives the thing it was taken from.
      - level: 2
        text: Subgoal 3, carry the lifetime through a struct, for Entry and its accessors, whose results outlive the entry. Subgoal 2, name that link in the signature, for first_message, whose result outlives the level asked for.
      - level: 3
        text: A struct holding a reference declares a lifetime, and its impl declares the same one. An accessor whose output lifetime is elided is tied to its self reference and dies with the entry. A function with two input references gets no elision, and a lifetime shared by both inputs and the output keeps both borrowed for as long as the result is used.
  unshown:
    hints:
      - level: 1
        text: Read the first error and the function and value it names. Then set each function's expected results in tests/visible.rs beside its input line.
      - level: 2
        text: Subgoal 1, find where the returned reference comes from, when the error sits at a value the function builds. Subgoal 2, name that link in the signature, when it is a missing lifetime or sits in results_outlive_the_marker.
      - level: 3
        text: A reference to a value the function owns cannot leave the function; text that exists in no input has to be returned as its owner. A function with two input references gets no elision, and the output is tied only to the inputs the result borrows from.
