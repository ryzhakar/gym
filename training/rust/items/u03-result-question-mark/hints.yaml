unit: u03-result-question-mark
author: drill author (opus), 2026-09-28
ladder: >-
  Pre-authored, to be reviewed by a fresh instance before use (O7, PLAN:113;
  human-authored beat generated, N3-r3-04 and N3-r5-04, 3 2 1). Level 1 points
  at the evidence, level 2 names the subgoal from example.md where the miss
  sits (trainer.md rule 25), level 3 states the Rust rule at stake. No level
  names a change or carries code from key/ (trainer.md rules 31-32). The
  three-level shape is default, unmeasured.
probes: none; probe-a and probe-b are unaided (PLAN:50)
problems:
  attempt:
    note: trainer.md rule 12 keeps the trainer silent during the attempt; this ladder serves only a request made after step 2.
    hints:
      - level: 1
        text: Three things can go wrong in a line, and LineError has one variant for each. For each variant, find the line of your code that produces it.
      - level: 2
        text: Subgoal 3, convert each failure into that type. split_once and parse each fail in their own std type, and neither of those types is LineError.
      - level: 3
        text: The question-mark operator returns early only with an error of the function's own error type. An Option has to become a Result, and a foreign error has to become a LineError, before that operator applies.
  reuse-1:
    hints:
      - level: 1
        text: Read which test fails and which variant it expected. Did the input fail at the comma, at x, or at y?
      - level: 2
        text: Subgoal 2, pick the function's error type. It is given, and each parse step maps into its own variant, even though both steps fail with the same std type.
      - level: 3
        text: map_err takes a function from the old error to the new one. A tuple variant's name is such a function.
  reuse-2:
    hints:
      - level: 1
        text: List the three failures in spec.md and the call or check that detects each one.
      - level: 2
        text: Subgoal 1, list the fallible steps. The subtraction is one of them.
      - level: 3
        text: checked_sub returns an Option, None exactly when the result would go below zero. An Option becomes a Result through ok_or, and the value given to ok_or can carry fields.
  unshown:
    hints:
      - level: 1
        text: Read the compiler's message for the test that calls ReadError::from. What type does it expect, and what does it find?
      - level: 2
        text: This is subgoal 3 with map_err ruled out. The conversion has to happen inside the question-mark operator itself.
      - level: 3
        text: The question-mark operator passes every error through From::from into the function's error type, and the test's ReadError::from is that same function.
