unit: u03-result-question-mark
author: drill author (opus), 2026-09-28
ladder: >-
  Pre-authored, to be reviewed by a fresh instance before use (O7, PLAN:113;
  human-authored beat generated, N3-r3-04 and N3-r5-04, 3 2 1). Level 1 points
  at the evidence, level 2 names the subgoal from example.md where the miss
  sits (trainer.md rule 25), level 3 states the Rust rule at stake. No level
  names a change or carries code from key/ (trainer.md rules 31-32). The
  three-level shape is default, unmeasured.
probes: none; probe-a and probe-b are unaided (PLAN:50)
compile:
  scope: unit
  note: Used first whenever the build is red, before the problem's own ladder.
  hints:
    - level: 1
      text: Run cargo check and read only the first error, its code, the line it names, and its label.
    - level: 2
      text: Run rustc --explain with that code. Which type does the compiler say it expected at that spot, and which did your code give?
    - level: 3
      text: The fix makes the expected and given types meet at that spot, either by changing what the code gives or by converting it there. Every other error is ignored until this one is gone.
problems:
  attempt-propagate:
    scope: src/propagate.rs
    note: trainer.md rule 12 keeps the trainer silent during the attempt; this ladder serves only a request made after step 2.
    hints:
      - level: 1
        text: Three things can go wrong in a line, and LineError has one variant for each. For each variant, find the line of your code that produces it.
      - level: 2
        text: Subgoal 3, convert each failure into that type. split_once and parse each fail in their own std type, and neither of those types is LineError.
      - level: 3
        text: The question-mark operator returns early with the error converted into the function's error type through the From trait. Here nothing converts into LineError on its own, and an Option is not a Result at all, so each failure has to reach LineError some other way before that operator applies.
  attempt-explicit:
    scope: src/explicit.rs
    note: trainer.md rule 12 keeps the trainer silent during the attempt; this ladder serves only a request made after step 2.
    hints:
      - level: 1
        text: In explicit.rs every failure leaves the function through its own return. Find each call whose result your code uses before looking at whether it failed.
      - level: 2
        text: Subgoal 3, convert each failure into that type, done by hand. A failed split_once and a failed parse each need their own LineError value, built where the failure is seen.
      - level: 3
        text: A match on an Option or a Result has one arm per variant, and an arm may end the function with return. The success arm can bind the inner value and let the function go on.
  reuse-1:
    hints:
      - level: 1
        text: Read which test fails and which variant it expected. Did the input fail at the comma, at x, or at y?
      - level: 2
        text: Subgoal 3, convert each failure into that type. Both parse steps fail with the same std type, and each has to become a different variant.
      - level: 3
        text: Subgoal 3 of the example shows how a parse error becomes a variant before the question-mark operator sees it. Compare what BadX and BadY take and give back with what that conversion needs.
  reuse-2:
    hints:
      - level: 1
        text: List the three failures in spec.md and the call or check that detects each one.
      - level: 2
        text: Subgoal 3, convert each failure into that type. One failure comes from a parse, one from your own check, and one from the subtraction, and each needs its own route into TxError.
      - level: 3
        text: checked_sub answers with an Option and the function answers with a Result. Subgoal 3 of the example shows how to cross from one to the other. Insufficient needs both numbers, and both are in scope on that line.
  reuse-3:
    hints:
      - level: 1
        text: Three things the function has to produce — whether there are any counts at all, which entry (if any) is the first one that fails to parse, and the total and largest over the rest. Find the rule in spec.md that detects each.
      - level: 2
        text: Subgoal 3, convert each failure into that type — but here it runs once per entry, not once for the whole input. Pair each token with its position before converting its parse failure with map_err.
      - level: 3
        text: .enumerate() on an iterator gives you (position, item) without a counter you maintain yourself, and ? inside a for loop returns from the whole function the first time it sees an Err — so the loop only ever reports the earliest bad entry, and the total and largest only ever see the entries before it.
  reuse-4:
    hints:
      - level: 1
        text: Take one input at a time and stop at the first line of seat_number that fails for it. Which line is that for x-y?
      - level: 2
        text: Subgoal 4, propagate with the question-mark operator. Each step either hands its value on or leaves the function, in the order the lines are written, not the order the input is written.
      - level: 3
        text: The question-mark operator returns the first Err it meets, and no later line runs. A check that would also fail further down is never reached, and only a value that passed every step gets to Ok.
  reuse-5:
    hints:
      - level: 1
        text: The compiler reports two errors. Read each one's label and the type it names on its line.
      - level: 2
        text: Subgoal 3, convert each failure into that type. One step fails with an Option and one with a std error, and neither is AddrError yet.
      - level: 3
        text: The question-mark operator in a function returning Result applies only to a Result, and it converts the error only through a From impl into the function's error type. An Option must first become a Result, and an error with no such impl must first become the function's error.
  unshown:
    hints:
      - level: 1
        text: Read the compiler's message for the test that calls ReadError::from. What type does it expect, and what does it find?
      - level: 2
        text: This is subgoal 3 with map_err ruled out. The conversion happens inside the question-mark operator, through the two impls spec.md asks for.
      - level: 3
        text: An impl of a conversion trait has one method. Its signature is in the trait's documentation, and its body is the one ReadError variant that fits the incoming error.
