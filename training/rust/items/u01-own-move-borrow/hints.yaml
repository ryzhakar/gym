unit: u01-own-move-borrow
author: drill author (opus), 2026-09-28
ladder: >-
  Pre-authored, to be reviewed by a fresh instance before use (O7, PLAN:113;
  human-authored beat generated, N3-r3-04 and N3-r5-04, 3 2 1). Level 1 points
  at the evidence, level 2 names the subgoal from example.md where the miss
  sits (trainer.md rule 25), level 3 states the Rust rule at stake. No level
  names a change or carries code from key/ (trainer.md rules 31-32). The
  three-level shape is default, unmeasured.
probes: none; probe-a and probe-b are unaided (PLAN:50)
problems:
  attempt:
    note: trainer.md rule 12 keeps the trainer silent during the attempt; this ladder serves only a request made after step 2.
    hints:
      - level: 1
        text: Three errors, one per function. Each error's labels name one value and the lines where it is borrowed, moved, and used again. Read those lines in the order they run.
      - level: 2
        text: Two subgoals, one per kind of miss. In drop_shorter_than_first and caller_side the miss is subgoal 3, reorder or narrow, because a use needs the value while it is still borrowed or already moved. In callee_side the miss is subgoal 2, decide what count_starting needs from names.
      - level: 3
        text: A borrow lasts until its last use. A value passed to a parameter of an owned type is gone from the caller. A usize is Copy, so a number read out of a value keeps nothing borrowed. A parameter's type decides whether the caller gives the value away or lends it.
  reuse-1:
    hints:
      - level: 1
        text: Read the three labels of E0502. Which variable holds the immutable borrow, and on which line is it used last?
      - level: 2
        text: Subgoal 4, copy or move. The variable top holds a reference into scores, not a number.
      - level: 3
        text: max over an iterator of &u32 yields a reference into the vector, and that reference keeps the vector borrowed for as long as it is used. u32 is Copy.
  reuse-2:
    hints:
      - level: 1
        text: E0382 says msg was moved in a previous iteration of the loop. Read the note under the error. It points at a parameter.
      - level: 2
        text: Subgoal 2, decide what each use needs. Does deliver store msg, change it, or only read it?
      - level: 3
        text: A parameter of an owned type takes the value away on every call, so a loop can make that call with the same value only once. The parameter's type decides whether a call takes the value or borrows it.
  unshown:
    hints:
      - level: 1
        text: E0507 says self.pending cannot be moved out because self is only borrowed. Each of the compiler's helps breaks the spec, one with a reference and the other with a copy.
      - level: 2
        text: Subgoal 2 holds, since drain_all needs to own the Vec. Subgoal 3 does not help, because no reordering removes the &mut. The missing piece is not in the example.
      - level: 3
        text: Through a mutable reference the field must hold a valid Vec at every moment, so the old Vec can leave only in the same step that something valid takes its place. The standard library has a function that does that exchange through a mutable reference.
