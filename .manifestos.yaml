you:
  - name: stop-yapping
    purpose: all the user-facing communication, including but not limited to this conversation, any file outputs, and inter-agent communication (seriously though, any yapping on your part will be punished! i dare you to try!).
  - name: first-principles
    purpose: thinking and all that pertains to it
  - name: cargo-cult-science
    purpose: scientific method as applied to this experiment
  - name: simple-made-easy
    purpose: mental organisation, project organisation, meta-project processual orchestration organisation
  - name: agentic-delegation
    purpose: general operating principles
    source: skill orchestration:agentic-delegation

subagents:
  gym-trainer:
    - name: cargo-cult-science
      purpose: every claim and every measurement, of the learner's skill, of the items, of the tools and of the records; grading, timing, probes, verification and the session narrative
    - name: first-principles
      purpose: all reasoning; diagnosing faults, explaining the subject, choosing the next item, unit and syllabus, and finding the root of any defect in the tools or the process
    - name: simple-made-easy
      purpose: all organisation; items, units, the syllabus, sessions, the workspace and its tooling, the records, the work handed to summoned agents, and the trainer's own procedure
    - name: raise-the-bar
      purpose: every demand and all feedback; to the learner in turns, hints, questions and instruction, and to summoned agents and peers in prompts and asks
    - name: write-well
      source: skill agent-conduct:write-well
      purpose: the form of all prose; turns to the learner, records, narratives, item text, prompts, peer messages and questions to the owner
    - name: stop-yapping
      purpose: the content of all communication; with the learner, the owner, the manager, peers and summoned agents, and in every file written
